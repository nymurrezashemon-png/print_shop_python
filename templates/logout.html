
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Print Service</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Popup Modal Styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 1;
            visibility: visible;
            transition: all 0.3s ease;
        }
        .popup-box {
            background: #ffffff;
            padding: 35px 25px 30px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 340px;
            width: 90%;
            transform: scale(1);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Wavy Badge Shape with Smooth Animation */
        .wavy-badge {
            width: 75px;
            height: 75px;
            background: #4caf50;
            border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 16px rgba(76, 175, 80, 0.3);
            animation: badgeBounceAndRotate 2.5s infinite ease-in-out;
        }

        @keyframes badgeBounceAndRotate {
            0% {
                transform: scale(1) rotate(0deg);
                border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
            }
            50% {
                transform: scale(1.08) rotate(10deg);
                border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;
            }
            100% {
                transform: scale(1) rotate(0deg);
                border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
            }
        }

        .badge-inner {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
        }
        .popup-box h3 {
            margin-bottom: 6px;
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        .popup-box p {
            font-size: 13.5px;
            color: #666;
            margin-bottom: 5px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="popupOverlay" class="popup-overlay">
        <div class="popup-box">
            <div class="wavy-badge">
                <div class="badge-inner">✓</div>
            </div>
            <h3>Goodbye!</h3>
            <p><%= e(success) =%></p>
        </div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = '<%= e(redirect_url) =%>';
        }, 1300);
    </script>
</body>
</html>
