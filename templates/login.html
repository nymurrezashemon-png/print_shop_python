<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Print Service</title>
    <style>
        :root {
            --brown-dark: #8a4a1c;
            --orange: #5b7fc7;
            --orange-deep: #3f61a8;
            --cream: #fff4e6;
            --ink: #1f2d4d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 150px 16px 40px;
            background:
                radial-gradient(circle at 15% 20%, rgba(150,180,255,0.5) 0, transparent 38%),
                radial-gradient(circle at 85% 80%, rgba(120,160,240,0.35) 0, transparent 40%),
                linear-gradient(135deg, #f3f7ff 0%, #dce8ff 100%);
            overflow-x: hidden;
        }
        /* soft floating paw-print dots in background */
        body::before, body::after {
            content: ""; position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
            background: rgba(91,127,199,0.10);
        }
        body::before { width: 340px; height: 340px; left: -90px; bottom: -90px; }
        body::after  { width: 260px; height: 260px; right: -70px; top: -70px; }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 410px;
            background: #ffffff;
            padding: 78px 34px 30px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(60,90,160,0.25), 0 6px 14px rgba(60,90,160,0.10);
            border: 1px solid rgba(91,127,199,0.15);
        }

        /* ===== Bear character ===== */
        .character {
            position: absolute;
            left: 50%;
            bottom: calc(100% - 26px);
            transform: translateX(-50%);
            width: 230px;
            height: 170px;
            z-index: 5;
            filter: drop-shadow(0 8px 10px rgba(80,40,10,0.22));
        }
        .character svg { width: 100%; height: 100%; overflow: visible; display: block; transform-origin: 50% 95%; animation: breathe 3.6s ease-in-out infinite; }
        @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.022); } }

        .eye-white { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
        @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

        .pupil { transition: transform 0.12s ease-out; }

        /* eyelids: close the eyes while typing the password */
        .eyelid { transform: scaleY(0); transition: transform 0.28s ease-in; }
        .eyelid.l { transform-origin: 80px 47.5px; }
        .eyelid.r { transform-origin: 150px 47.5px; }
        .lid-line { opacity: 0; transition: opacity 0.2s ease 0.18s; }
        .character.password-focus .eyelid { transform: scaleY(1); }
        .character.password-focus .lid-line { opacity: 1; }

        .character.happy  { animation: hop 0.7s ease-in-out infinite; }
        .character.sad    { animation: shake 0.5s ease-in-out; }
        @keyframes hop   { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-12px); } }
        @keyframes shake { 0%,100% { transform: translateX(-50%); } 20% { transform: translateX(calc(-50% - 8px)); } 40% { transform: translateX(calc(-50% + 8px)); } 60% { transform: translateX(calc(-50% - 5px)); } 80% { transform: translateX(calc(-50% + 5px)); } }

        /* ===== Form ===== */
        .title { text-align: center; margin-bottom: 22px; }
        .title h2 { font-size: 22px; color: var(--ink); font-weight: 800; letter-spacing: -0.3px; }
        .title p  { font-size: 13px; color: #7285a8; margin-top: 3px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #33466b; font-weight: 700; font-size: 13px; }
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #dbe5f7;
            background: #f8faff;
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            color: var(--ink);
            transition: all 0.25s ease;
        }
        .form-group input::placeholder { color: #a5b3cc; }
        .form-group input:focus {
            border-color: var(--orange);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(91,127,199,0.18);
        }

        .forgot-pass { text-align: right; margin: -6px 0 16px; font-size: 13px; }
        .forgot-pass a, .switch-link a { color: var(--orange-deep); text-decoration: none; font-weight: 700; }
        .forgot-pass a:hover, .switch-link a:hover { text-decoration: underline; }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #7f9fe0 0%, #5b7fc7 100%);
            border: none;
            border-bottom: 4px solid #3f5f9f;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.3px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(91,127,199,0.40);
            transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
        }
        .login-btn:hover { filter: brightness(1.06); box-shadow: 0 10px 22px rgba(91,127,199,0.5); }
        .login-btn:active { transform: translateY(3px); border-bottom-width: 1px; }

        .switch-link { text-align: center; margin-top: 18px; font-size: 13px; color: #6b7c9c; }

        /* ===== Popup ===== */
        .popup-overlay {
            position: fixed; inset: 0;
            background: rgba(20,30,60,0.45);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .popup-overlay.show { opacity: 1; visibility: visible; }
        .popup-box {
            background: #fff;
            padding: 35px 25px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 340px; width: 90%;
            transform: scale(0.7);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-overlay.show .popup-box { transform: scale(1); }
        .wavy-badge {
            width: 75px; height: 75px;
            background: #4caf50;
            border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
            margin: 0 auto 15px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 16px rgba(76,175,80,0.3);
            animation: badgeBounceAndRotate 2.5s infinite ease-in-out;
        }
        .error-badge { background: #f44336 !important; box-shadow: 0 8px 16px rgba(244,67,54,0.3) !important; }
        @keyframes badgeBounceAndRotate {
            0%   { transform: scale(1) rotate(0deg); border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; }
            50%  { transform: scale(1.08) rotate(10deg); border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%; }
            100% { transform: scale(1) rotate(0deg); border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; }
        }
        .badge-inner {
            width: 52px; height: 52px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: #fff; font-weight: bold;
        }
        .popup-box h3 { margin-bottom: 6px; font-size: 20px; font-weight: 700; color: #333; }
        .popup-box p { font-size: 13.5px; color: #666; line-height: 1.4; }

        @media (max-width: 440px) { .login-container { padding: 78px 22px 26px; } }
    </style>
</head>
<body>

    <div id="popupOverlay" class="popup-overlay <%= 'show' if (not empty(error) or not empty(success)) else '' =%>">
        <div class="popup-box">
            <div class="wavy-badge <%= 'error-badge' if not empty(error) else '' =%>">
                <div class="badge-inner">
                    <%= '✕' if not empty(error) else '✓' =%>                </div>
            </div>
            <h3><%= 'Oops!' if not empty(error) else 'Success!' =%></h3>
            <p><%= e(error if not empty(error) else (success if not empty(success) else '')) =%></p>
        </div>
    </div>

                <input type="text" name="student_id" id="student_id" maxlength="4" placeholder="Enter last 4 digits" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="forgot-pass">
                <a href="forgot-password.php">Forgot Password?</a>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="switch-link">
            Don't have an account? <a href="register.php">Register here</a>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const character = document.getElementById('character');
        const pupil1 = document.getElementById('pupil1');
        const pupil2 = document.getElementById('pupil2');
        const typingInputs = ['student_id'].map(function(id) { return document.getElementById(id); }).filter(Boolean);

        function lookAt(x, y) {
            const t = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px)';
            pupil1.style.transform = t;
            pupil2.style.transform = t;
        }

        // Eyes follow the mouse
        document.addEventListener('mousemove', function(e) {
            const r = character.getBoundingClientRect();
            const dx = e.clientX - (r.left + r.width / 2);
            const dy = e.clientY - (r.top + r.height * 0.55);
            const dist = Math.hypot(dx, dy) || 1;
            const k = Math.min(dist / 120, 1);
            lookAt((dx / dist) * 9 * k, (dy / dist) * 8 * k);
        });

        // Eyes look down while typing; they drift right as the text gets longer
        typingInputs.forEach(function(inp) {
            inp.addEventListener('input', function(e) {
                const max = e.target.maxLength > 0 ? e.target.maxLength : 24;
                const pct = Math.min(e.target.value.length / max, 1);
                lookAt(-8 + 16 * pct, 7);
            });
        });

        // Eyes close on password focus
        if (passwordInput) {
            passwordInput.addEventListener('focus', function() { character.classList.add('password-focus'); });
            passwordInput.addEventListener('blur',  function() { character.classList.remove('password-focus'); });
        }

        function closePopup() {
            const overlay = document.getElementById('popupOverlay');
            if (overlay) overlay.classList.remove('show');
        }

        <%PY if redirect PY%>        setTimeout(function() {
            window.location.href = '<%= e(redirect_url) =%>';
        }, 1500);
        <%PY endif PY%>
        <%PY if not empty(error) PY%>        setTimeout(function() {
            closePopup();
        }, 2200);
        <%PY endif PY%>    </script>
</body>
</html>
